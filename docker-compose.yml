# Local dev stack: `docker compose up --build`
# Every value can be overridden with a .env file (see .env.example).
name: sew-swap

services:
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud emulators firestore start --host-port=0.0.0.0:8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI -> http://localhost:8025
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      target: dev
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      PORT: 8080
      NODE_ENV: development
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-sew-swap-local}
      FIRESTORE_EMULATOR_HOST: firestore:8081
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-Sew Swap <no-reply@sewswap.local>}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-insecure-secret-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@example.test}
      # Higher than the production default (5) so repeated e2e runs don't lock out the admin account.
      LOGIN_REQUESTS_PER_HOUR: ${LOGIN_REQUESTS_PER_HOUR:-50}
      # Never call Instagram locally: the post's shortcode or the handle's prefix picks the answer (see src/instagram/strategies.ts).
      INSTAGRAM_POST_STRATEGIES: ${INSTAGRAM_POST_STRATEGIES:-fakePost}
      INSTAGRAM_CHECK_STRATEGIES: ${INSTAGRAM_CHECK_STRATEGIES:-fake}
      # Shorter than the production default (10) so e2e doesn't wait between checks.
      INSTAGRAM_CHECK_MIN_SECONDS: ${INSTAGRAM_CHECK_MIN_SECONDS:-2}
    volumes:
      - ./apps/api/src:/app/src
    depends_on:
      firestore:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      target: dev
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      VITE_API_PROXY: http://api:8080
    volumes:
      - ./apps/web/src:/app/src
    depends_on:
      - api

  # Playwright end-to-end tests. Run with:
  #   docker compose --profile test run --rm --build e2e
  e2e:
    profiles: ["test"]
    build: ./e2e
    environment:
      BASE_URL: http://web:5173
      MAILPIT_URL: http://mailpit:8025
    volumes:
      - ./e2e/tests:/e2e/tests
      - ./e2e/playwright-report:/e2e/playwright-report
      - ./e2e/test-results:/e2e/test-results
    depends_on:
      - web
      - mailpit
